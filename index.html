<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Nova | إدارة الشحن</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }
    header {
      background: #101c35;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; }
    header p { margin: 0; color: #cbd5e1; }
    main { max-width: 1000px; margin: 24px auto; padding: 16px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
    }
    .card, form {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0000000b;
    }
    .card strong { display: block; font-size: 25px; margin-top: 10px; }
    h2 { margin-top: 0; }
    form { margin-top: 20px; }
    .fields {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }
    label { display: block; font-weight: bold; margin-bottom: 6px; }
    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 15px;
    }
    button {
      border: 0;
      background: #1769e0;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 14px;
    }
    .table-wrap { overflow-x: auto; margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: right; }
    th { background: #e8eef8; }
    .delete { background: #dc3545; padding: 7px; margin: 0; }
    .status { color: #1769e0; font-weight: bold; }
    .notice { color: #64748b; font-size: 13px; line-height: 1.7; }
  </style>
</head>
<body>
  <header>
    <h1>SUPER NOVA</h1>
    <p>نظام إدارة شركة الشحن</p>
  </header>

  <main>
    <section class="stats">
      <div class="card">إجمالي الشحنات<strong id="total">0</strong></div>
      <div class="card">تم التسليم<strong id="delivered">0</strong></div>
      <div class="card">قيد التوصيل<strong id="pending">0</strong></div>
    </section>

    <form id="shipmentForm">
      <h2>تسجيل شحنة جديدة</h2>
      <div class="fields">
        <div>
          <label for="sender">اسم العميل</label>
          <input id="sender" required placeholder="اسم العميل أو التاجر">
        </div>
        <div>
          <label for="receiver">اسم المستلم</label>
          <input id="receiver" required placeholder="اسم المستلم">
        </div>
        <div>
          <label for="phone">رقم هاتف المستلم</label>
          <input id="phone" required type="tel" placeholder="01xxxxxxxxx">
        </div>
        <div>
          <label for="address">عنوان التوصيل</label>
          <input id="address" required placeholder="المحافظة والمنطقة والعنوان">
        </div>
        <div>
          <label for="amount">مبلغ التحصيل بالجنيه</label>
          <input id="amount" type="number" min="0" value="0" required>
        </div>
        <div>
          <label for="status">حالة الشحنة</label>
          <select id="status">
            <option>جديدة</option>
            <option>قيد التوصيل</option>
            <option>تم التسليم</option>
            <option>مرتجع</option>
          </select>
        </div>
      </div>
      <button type="submit">إضافة الشحنة</button>
      <p class="notice">نسخة أولية للتجربة على نفس المتصفح والجهاز. البيانات ليست محفوظة على خادم مشترك.</p>
    </form>

    <section style="margin-top:24px">
      <h2>سجل الشحنات</h2>
      <input id="search" placeholder="ابحث باسم العميل أو المستلم أو رقم الهاتف">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>رقم</th><th>العميل</th><th>المستلم</th>
              <th>الهاتف</th><th>التحصيل</th><th>الحالة</th><th>حذف</th>
            </tr>
          </thead>
          <tbody id="shipments"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('shipmentForm');
    const body = document.getElementById('shipments');
    const search = document.getElementById('search');
    let shipments = JSON.parse(localStorage.getItem('superNovaShipments') || '[]');

    function render() {
      const q = search.value.trim().toLowerCase();
      const filtered = shipments.filter(s =>
        [s.sender, s.receiver, s.phone].some(v =>
          v.toLowerCase().includes(q)
        )
      );

      body.replaceChildren();

      filtered.forEach(s => {
        const tr = document.createElement('tr');
        [s.id, s.sender, s.receiver, s.phone,
         Number(s.amount).toLocaleString('en-US') + ' ج.م',
         s.status].forEach(value => {
          const td = document.createElement('td');
          td.textContent = value;
          tr.appendChild(td);
        });

        const action = document.createElement('td');
        const btn = document.createElement('button');
        btn.textContent = 'حذف';
        btn.className = 'delete';
        btn.onclick = () => {
          if (confirm('متأكد إنك عايز تحذف الشحنة؟')) {
            shipments = shipments.filter(x => x.id !== s.id);
            save();
          }
        };
        action.appendChild(btn);
        tr.appendChild(action);
        body.appendChild(tr);
      });

      document.getElementById('total').textContent = shipments.length;
      document.getElementById('delivered').textContent =
        shipments.filter(s => s.status === 'تم التسليم').length;
      document.getElementById('pending').textContent =
        shipments.filter(s => s.status === 'قيد التوصيل').length;
    }

    function save() {
      localStorage.setItem('superNovaShipments', JSON.stringify(shipments));
      render();
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      shipments.unshift({
        id: Date.now().toString().slice(-8),
        sender: document.getElementById('sender').value.trim(),
        receiver: document.getElementById('receiver').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        address: document.getElementById('address').value.trim(),
        amount: document.getElementById('amount').value,
        status: document.getElementById('status').value
      });
      save();
      form.reset();
      document.getElementById('amount').value = 0;
      alert('تمت إضافة الشحنة بنجاح');
    });

    search.addEventListener('input', render);
    render();
  </script>
</body>
  </html>
